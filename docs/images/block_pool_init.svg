<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="940" height="430" fill="#ffffff"/>
  <text x="470" y="30" font-size="17" font-weight="600" text-anchor="middle" fill="#0f172a">BlockPool.__init__ 的四个步骤</text>
  <text x="470" y="50" font-size="12" text-anchor="middle" fill="#64748b">vllm/v1/core/block_pool.py</text>

  <!-- step 1 -->
  <rect x="24" y="72" width="212" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <circle cx="46" cy="94" r="12" fill="#2563eb"/><text x="46" y="99" font-size="13" font-weight="600" text-anchor="middle" fill="#fff">1</text>
  <text x="66" y="99" font-size="13" font-weight="600" fill="#1d4ed8">批量创建 block 对象</text>
  <text x="40" y="122" font-size="11" fill="#334155">blocks = [KVCacheBlock(idx)</text>
  <text x="40" y="138" font-size="11" fill="#334155">          for idx in range(N)]</text>
  <text x="40" y="162" font-size="11" fill="#64748b">此时链表指针全为 None</text>
  <rect x="40" y="172" width="180" height="20" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="130" y="186" font-size="10.5" text-anchor="middle" fill="#1e40af">下标 i == block_id == 物理块下标</text>

  <!-- step 2 -->
  <rect x="252" y="72" width="212" height="130" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.6"/>
  <circle cx="274" cy="94" r="12" fill="#059669"/><text x="274" y="99" font-size="13" font-weight="600" text-anchor="middle" fill="#fff">2</text>
  <text x="294" y="99" font-size="13" font-weight="600" fill="#047857">建链</text>
  <text x="268" y="122" font-size="11" fill="#334155">FreeKVCacheBlockQueue(blocks)</text>
  <text x="268" y="146" font-size="11" fill="#64748b">串成双向链表 + 头尾哨兵</text>
  <text x="268" y="162" font-size="11" fill="#64748b">支持 O(1) 中间摘除</text>
  <rect x="268" y="172" width="180" height="20" rx="4" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="358" y="186" font-size="10.5" text-anchor="middle" fill="#065f46">num_free_blocks = len(blocks)</text>

  <!-- step 3 -->
  <rect x="480" y="72" width="212" height="130" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <circle cx="502" cy="94" r="12" fill="#d97706"/><text x="502" y="99" font-size="13" font-weight="600" text-anchor="middle" fill="#fff">3</text>
  <text x="522" y="99" font-size="13" font-weight="600" fill="#b45309">前缀缓存查找表</text>
  <text x="496" y="122" font-size="11" fill="#334155">cached_block_hash_to_block</text>
  <text x="496" y="146" font-size="11" fill="#64748b">key = (block_hash, group_id)</text>
  <rect x="496" y="158" width="180" height="34" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="586" y="172" font-size="10.5" text-anchor="middle" fill="#78350f">同一 hash 在不同 group 下</text>
  <text x="586" y="186" font-size="10.5" text-anchor="middle" fill="#78350f">是不同条目</text>

  <!-- step 4 -->
  <rect x="708" y="72" width="208" height="130" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <circle cx="730" cy="94" r="12" fill="#dc2626"/><text x="730" y="99" font-size="13" font-weight="600" text-anchor="middle" fill="#fff">4</text>
  <text x="750" y="99" font-size="13" font-weight="600" fill="#b91c1c">摘走 null block</text>
  <text x="724" y="122" font-size="11" fill="#334155">null_block = queue.popleft()</text>
  <text x="724" y="138" font-size="11" fill="#334155">null_block.is_null = True</text>
  <rect x="724" y="150" width="176" height="42" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="812" y="164" font-size="10.5" text-anchor="middle" fill="#7f1d1d">实际可用块数 = N − 1</text>
  <text x="812" y="180" font-size="10.5" text-anchor="middle" fill="#7f1d1d">ref_cnt 不维护，靠 is_null 短路</text>

  <line x1="240" y1="137" x2="248" y2="137" stroke="#475569" stroke-width="1.6" marker-end="url(#d)"/>
  <line x1="468" y1="137" x2="476" y2="137" stroke="#475569" stroke-width="1.6" marker-end="url(#d)"/>
  <line x1="696" y1="137" x2="704" y2="137" stroke="#475569" stroke-width="1.6" marker-end="url(#d)"/>

  <!-- 结果 -->
  <rect x="24" y="228" width="892" height="176" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="44" y="254" font-size="14" font-weight="600" fill="#0f172a">初始化完成后的池子状态</text>

  <g font-size="11" text-anchor="middle">
    <rect x="60" y="272" width="80" height="46" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="100" y="292" fill="#475569">fake head</text><text x="100" y="308" font-size="10" fill="#94a3b8">block_id = -1</text>

    <rect x="164" y="272" width="80" height="46" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="204" y="292" fill="#7f1d1d">block 0</text><text x="204" y="308" font-size="10" fill="#b91c1c">已被摘走</text>

    <rect x="268" y="272" width="80" height="46" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="308" y="292" fill="#334155">block 1</text><text x="308" y="308" font-size="10" fill="#94a3b8">free</text>

    <rect x="372" y="272" width="80" height="46" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="412" y="292" fill="#334155">block 2</text><text x="412" y="308" font-size="10" fill="#94a3b8">free</text>

    <text x="490" y="300" font-size="16" fill="#64748b">· · ·</text>

    <rect x="528" y="272" width="92" height="46" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="574" y="292" fill="#334155">block N−1</text><text x="574" y="308" font-size="10" fill="#94a3b8">free</text>

    <rect x="644" y="272" width="80" height="46" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="684" y="292" fill="#475569">fake tail</text><text x="684" y="308" font-size="10" fill="#94a3b8">block_id = -1</text>
  </g>

  <g stroke="#64748b" stroke-width="1.3" fill="none">
    <path d="M244 288 L264 288" marker-end="url(#d)"/>
    <path d="M348 288 L368 288" marker-end="url(#d)"/>
    <path d="M452 288 L472 288" marker-end="url(#d)"/>
    <path d="M508 288 L524 288" marker-end="url(#d)"/>
    <path d="M620 288 L640 288" marker-end="url(#d)"/>
    <path d="M264 306 L244 306" marker-end="url(#d)"/>
    <path d="M368 306 L348 306" marker-end="url(#d)"/>
    <path d="M472 306 L452 306" marker-end="url(#d)"/>
    <path d="M640 306 L620 306" marker-end="url(#d)"/>
  </g>
  <text x="140" y="336" font-size="10.5" fill="#64748b">next_free_block →</text>
  <text x="140" y="350" font-size="10.5" fill="#64748b">← prev_free_block</text>

  <rect x="744" y="264" width="156" height="120" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="822" y="284" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0f172a">取块 / 还块方向</text>
  <text x="758" y="306" font-size="10.5" fill="#475569">get_new_blocks → 队首取</text>
  <text x="758" y="326" font-size="10.5" fill="#475569">free（无 hash）→ 插队首</text>
  <text x="758" y="346" font-size="10.5" fill="#475569">free（有 hash）→ 插队尾</text>
  <text x="758" y="368" font-size="10.5" fill="#2563eb">三者合起来 ≈ LRU</text>

  <text x="404" y="376" font-size="11" fill="#475569">哨兵节点永远不会被 pop，保证真实块总有前驱和后继 → 链表操作无空指针分支</text>
</svg>
