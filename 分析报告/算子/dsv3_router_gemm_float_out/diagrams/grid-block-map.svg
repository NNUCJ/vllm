<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="960" height="700" fill="#ffffff"/>
  <text x="480" y="30" fill="#111827" font-size="18" font-weight="600" text-anchor="middle">Grid and Block Layout</text>
  <text x="80" y="80" fill="#6b7280" font-size="13">Grid: N=256 blocks</text>
  <rect x="80" y="90" width="80" height="50" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="120" y="112" fill="#111827" font-size="12" text-anchor="middle">Block 0</text>
  <text x="120" y="128" fill="#6b7280" font-size="11" text-anchor="middle">expert 0</text>
  <rect x="180" y="90" width="80" height="50" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="220" y="112" fill="#111827" font-size="12" text-anchor="middle">Block 1</text>
  <text x="220" y="128" fill="#6b7280" font-size="11" text-anchor="middle">expert 1</text>
  <rect x="280" y="90" width="80" height="50" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="320" y="110" fill="#111827" font-size="16" text-anchor="middle">...</text>
  <rect x="800" y="90" width="80" height="50" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="840" y="112" fill="#111827" font-size="12" text-anchor="middle">Block 255</text>
  <text x="840" y="128" fill="#6b7280" font-size="11" text-anchor="middle">expert 255</text>
  <path d="M 220,150 L 220,200 L 360,200" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="218" y="175" width="90" height="18" fill="#ffffff" opacity="0.95"/>
  <text x="263" y="188" fill="#2563eb" font-size="12" text-anchor="middle">blockIdx.x = n</text>
  <rect x="360" y="180" width="500" height="480" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="610" y="210" fill="#111827" font-size="14" font-weight="600" text-anchor="middle">Block n (128 threads, 4 warps)</text>
  <rect x="380" y="240" width="460" height="90" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="390" y="260" fill="#111827" font-size="13" font-weight="600">Warp 0</text>
  <rect x="390" y="270" width="50" height="50" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="415" y="298" fill="#111827" font-size="11" text-anchor="middle">0</text>
  <rect x="445" y="270" width="50" height="50" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="470" y="298" fill="#111827" font-size="11" text-anchor="middle">1</text>
  <rect x="500" y="270" width="50" height="50" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="525" y="298" fill="#111827" font-size="11" text-anchor="middle">2</text>
  <rect x="555" y="270" width="50" height="50" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="580" y="298" fill="#111827" font-size="11" text-anchor="middle">3</text>
  <rect x="610" y="270" width="50" height="50" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="635" y="298" fill="#111827" font-size="11" text-anchor="middle">4</text>
  <rect x="665" y="270" width="50" height="50" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="690" y="298" fill="#111827" font-size="11" text-anchor="middle">5</text>
  <rect x="720" y="270" width="50" height="50" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="745" y="298" fill="#111827" font-size="11" text-anchor="middle">6</text>
  <rect x="775" y="270" width="50" height="50" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="800" y="298" fill="#111827" font-size="11" text-anchor="middle">7</text>
  <text x="810" y="298" fill="#6b7280" font-size="14" text-anchor="middle">...</text>
  <text x="400" y="335" fill="#6b7280" font-size="11">32 threads (laneId 0..31)</text>
  <rect x="380" y="350" width="460" height="90" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="390" y="370" fill="#111827" font-size="13" font-weight="600">Warp 1</text>
  <text x="610" y="405" fill="#6b7280" font-size="12" text-anchor="middle">32 threads</text>
  <rect x="380" y="460" width="460" height="90" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="390" y="480" fill="#111827" font-size="13" font-weight="600">Warp 2</text>
  <text x="610" y="515" fill="#6b7280" font-size="12" text-anchor="middle">32 threads</text>
  <rect x="380" y="570" width="460" height="90" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="390" y="590" fill="#111827" font-size="13" font-weight="600">Warp 3</text>
  <text x="610" y="625" fill="#6b7280" font-size="12" text-anchor="middle">32 threads</text>
  <text x="80" y="680" fill="#6b7280" font-size="12">gridDim.x = N (256 or 384)</text>
  <text x="320" y="680" fill="#6b7280" font-size="12">blockDim.x = 128</text>
  <text x="580" y="680" fill="#6b7280" font-size="12">threads per warp = 32</text>
</svg>